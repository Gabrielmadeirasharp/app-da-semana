<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App da Semana</title>
    <meta name="description" content="Protótipos de mini apps para negócios locais de Fortaleza." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --fundo: #f4f1ea;
        --texto: #161616;
        --suave: #66625a;
        --borda: #dcd6c8;
        --cartao: #ffffff;
        --destaque: #e8590c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fundo: #151413;
          --texto: #f1eee8;
          --suave: #a29d93;
          --borda: #2e2c29;
          --cartao: #1e1d1b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--fundo);
        color: var(--texto);
        font-family: 'Archivo', system-ui, sans-serif;
        font-size: 16px;
      }
      header { max-width: 1100px; margin: 0 auto; padding: 48px 16px 24px; }
      h1 { margin: 0; font-size: clamp(40px, 9vw, 76px); font-weight: 800; letter-spacing: -0.03em; line-height: 0.95; }
      header p { max-width: 560px; color: var(--suave); font-size: 18px; line-height: 1.45; }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px 48px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
      }
      .app {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 12px 12px 16px;
        border: 1px solid var(--borda);
        border-radius: 18px;
        background: var(--cartao);
        color: inherit;
        text-decoration: none;
        transition: transform 200ms ease, border-color 200ms ease;
      }
      a.app:hover { transform: translateY(-3px); border-color: var(--texto); }
      .capa {
        aspect-ratio: 390 / 600;
        border-radius: 10px;
        overflow: hidden;
        background: var(--fundo);
        display: grid;
        place-items: center;
        color: var(--suave);
        margin-bottom: 8px;
      }
      .capa img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
      .num { font-size: 13px; color: var(--suave); font-weight: 600; }
      .titulo { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
      .nicho { font-size: 14px; color: var(--suave); }
      .palavra { margin-top: 6px; font-size: 13px; color: var(--suave); }
      .palavra b { color: var(--destaque); letter-spacing: 0.04em; }
      .breve { opacity: 0.55; }
      footer { text-align: center; color: var(--suave); font-size: 13px; padding: 0 16px 32px; }
    </style>
  </head>
  <body>
    <header>
      <h1>App da<br />Semana</h1>
      <p>Mini apps para negócios de Fortaleza. Toque em um app para testar no celular.</p>
    </header>
    <main>
      <!--APPS-->
    </main>
    <footer>Protótipos demonstrativos · marcas fictícias · valores ilustrativos</footer>
  </body>
</html>
